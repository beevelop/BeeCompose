name: traefik

# Traefik v3 reverse proxy with Let's Encrypt (CloudFlare DNS-01)
#
# This is the exposed mode configuration with public ports 80/443.
# For Cloudflare Tunnel deployments, use traefik-tunnel instead.
#
# Usage:
#   docker compose -f oci://ghcr.io/beevelop/traefik:latest --env-file .env up -d

services:

  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6}
    container_name: traefik
    depends_on:
      traefik-init:
        condition: service_completed_successfully
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_config:/etc/traefik:ro
      - acme_data:/acme
      - logs_data:/var/log/traefik
    environment:
      - CF_API_EMAIL=${CLOUDFLARE_EMAIL:-}
      - CF_API_KEY=${CLOUDFLARE_API_KEY:-}
    ports:
      - target: 80
        published: ${TRAEFIK_HTTP_PORT:-80}
        protocol: tcp
        host_ip: 0.0.0.0
      - target: 443
        published: ${TRAEFIK_HTTPS_PORT:-443}
        protocol: tcp
        host_ip: 0.0.0.0
      - target: 8080
        published: ${TRAEFIK_DASHBOARD_PORT:-8080}
        protocol: tcp
        host_ip: 0.0.0.0
    networks:
      - default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DOMAIN:-traefik.example.com}`) && (PathPrefix(`/api`) || PathPrefix(`/dashboard`))"
      - "traefik.http.routers.dashboard.entrypoints=traefik"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=dashboard-auth"
      - "traefik.http.middlewares.dashboard-auth.basicauth.users=${TRAEFIK_AUTH:-admin:$$apr1$$changeme}"

  traefik-init:
    image: alpine:3.24
    container_name: traefik-init
    volumes:
      - traefik_config:/config
    environment:
      - TRAEFIK_EMAIL=${TRAEFIK_EMAIL:-${CLOUDFLARE_EMAIL:-admin@example.com}}
    command:
      - sh
      - -c
      - |
        set -e
        
        echo "=== Traefik Exposed Mode Configuration ==="
        echo "Generating configuration with Let's Encrypt (CloudFlare DNS-01)..."
        
        cat > /config/traefik.yml << EOFCONFIG
        # Traefik v3 - Exposed Mode
        # Direct port exposure with Let's Encrypt via CloudFlare DNS-01
        
        api:
          dashboard: true
          insecure: false
        
        ping:
          entryPoint: traefik
        
        entryPoints:
          web:
            address: ":80"
            http:
              redirections:
                entryPoint:
                  to: websecure
                  scheme: https
          websecure:
            address: ":443"
            http:
              tls:
                certResolver: letsencrypt
          traefik:
            address: ":8080"
        
        certificatesResolvers:
          letsencrypt:
            acme:
              email: "$${TRAEFIK_EMAIL}"
              storage: /acme/acme.json
              dnsChallenge:
                provider: cloudflare
                delayBeforeCheck: 0
        
        providers:
          docker:
            exposedByDefault: false
            network: traefik_default
        
        log:
          level: INFO
          filePath: /var/log/traefik/traefik.log
        
        accessLog:
          filePath: /var/log/traefik/access.log
        EOFCONFIG
        
        echo ""
        echo "=== Generated Configuration ==="
        cat /config/traefik.yml
        echo ""
        echo "Configuration saved to /config/traefik.yml"
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "500k"
        max-file: "50"

networks:
  default:
    name: traefik_default
    driver: bridge

volumes:
  traefik_config:
    name: ${COMPOSE_PROJECT_NAME:-traefik}_config
  acme_data:
    name: ${COMPOSE_PROJECT_NAME:-traefik}_acme_data
  logs_data:
    name: ${COMPOSE_PROJECT_NAME:-traefik}_logs_data
